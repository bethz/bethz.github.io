<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Brain split visual -->
  <g transform="translate(950, 280)">
    <!-- Left brain (circuit) -->
    <ellipse cx="-45" cy="0" rx="50" ry="70" fill="none" stroke="#F0C75E" stroke-width="3"/>
    <rect x="-65" y="-20" width="10" height="40" fill="#F0C75E"/>
    <rect x="-35" y="-30" width="12" height="15" fill="#F0C75E"/>
    <circle cx="-45" cy="30" r="8" fill="#F0C75E"/>
    <!-- Right brain (question mark) -->
    <ellipse cx="45" cy="0" rx="50" ry="70" fill="none" stroke="#7AB3E0" stroke-width="3"/>
    <text x="45" y="35" font-family="Segoe UI" font-size="70" font-weight="bold" fill="#7AB3E0" text-anchor="middle">?</text>
    <!-- Dividing line -->
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#F0C75E" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="200" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
    AI: Artificial
  </text>
  <text x="100" y="280" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
    Intelligence or
  </text>
  <text x="100" y="360" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#F0C75E" letter-spacing="1">
    Any Idiot?
  </text>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>