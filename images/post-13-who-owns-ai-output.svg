<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Fingerprint with circuit pattern -->
  <g transform="translate(950, 280)">
    <!-- Main fingerprint -->
    <path d="M 0,-60 Q -40,-50 -50,0 Q -40,50 0,60 Q 40,50 50,0 Q 40,-50 0,-60" fill="none" stroke="#F0C75E" stroke-width="3"/>
    <!-- Fingerprint ridge lines -->
    <path d="M -35,-50 Q -25,-45 -30,0 Q -25,45 -35,50" fill="none" stroke="#F0C75E" stroke-width="2" opacity="0.7"/>
    <path d="M -15,-55 Q -5,-50 -10,0 Q -5,50 -15,55" fill="none" stroke="#F0C75E" stroke-width="2" opacity="0.7"/>
    <path d="M 5,-55 Q 15,-50 10,0 Q 15,50 5,55" fill="none" stroke="#F0C75E" stroke-width="2" opacity="0.7"/>
    <path d="M 25,-50 Q 35,-45 30,0 Q 35,50 25,50" fill="none" stroke="#F0C75E" stroke-width="2" opacity="0.7"/>
    
    <!-- Circuit pattern overlay -->
    <circle cx="-20" cy="-20" r="5" fill="#7AB3E0"/>
    <circle cx="20" cy="20" r="5" fill="#7AB3E0"/>
    <line x1="-20" y1="-20" x2="0" y2="0" stroke="#7AB3E0" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#7AB3E0" stroke-width="2"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="240" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Who Owns
  </text>
  <text x="100" y="340" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    the AI Output?
  </text>
  
  <!-- Accent line -->
  <line x1="100" y1="360" x2="550" y2="360" stroke="#7AB3E0" stroke-width="4"/>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>