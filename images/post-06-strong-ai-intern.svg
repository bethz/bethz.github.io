<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Robot with supervisor -->
  <g transform="translate(950, 280)">
    <!-- Robot body -->
    <rect x="-35" y="-50" width="70" height="100" fill="#F0C75E" rx="3"/>
    <!-- Robot head -->
    <rect x="-30" y="-80" width="60" height="35" fill="#F0C75E" rx="2"/>
    <!-- Robot eyes -->
    <circle cx="-15" cy="-65" r="6" fill="#2E4057"/>
    <circle cx="15" cy="-65" r="6" fill="#2E4057"/>
    <!-- Robot smile/confident -->
    <path d="M -15,-50 Q 0,-45 15,-50" fill="none" stroke="#2E4057" stroke-width="2"/>
    <!-- Robot arms -->
    <line x1="-40" y1="-20" x2="-70" y2="-15" stroke="#F0C75E" stroke-width="5"/>
    <line x1="40" y1="-20" x2="70" y2="-15" stroke="#F0C75E" stroke-width="5"/>
    
    <!-- Supervisor (small figure watching) -->
    <g transform="translate(-100, -40)">
      <!-- Head -->
      <circle cx="0" cy="-30" r="12" fill="#7AB3E0"/>
      <!-- Body -->
      <rect x="-8" y="-15" width="16" height="30" fill="#7AB3E0"/>
      <!-- Arms -->
      <line x1="-8" y1="-5" x2="-25" y2="-5" stroke="#7AB3E0" stroke-width="3"/>
      <line x1="8" y1="-5" x2="25" y2="-5" stroke="#7AB3E0" stroke-width="3"/>
      <!-- Watching line -->
      <line x1="20" y1="-20" x2="50" y2="0" stroke="#7AB3E0" stroke-width="2" stroke-dasharray="3,3"/>
    </g>
  </g>
  
  <!-- Main title -->
  <text x="100" y="240" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    The Strong
  </text>
  <text x="100" y="340" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    AI Intern
  </text>
  
  <!-- Accent line -->
  <line x1="100" y1="360" x2="450" y2="360" stroke="#F0C75E" stroke-width="4"/>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>