<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Pause button visual -->
  <g transform="translate(950, 280)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#F0C75E" stroke-width="3"/>
    <!-- Left bar -->
    <rect x="-40" y="-60" width="18" height="120" fill="#F0C75E" rx="2"/>
    <!-- Right bar -->
    <rect x="22" y="-60" width="18" height="120" fill="#F0C75E" rx="2"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="240" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Stop Building.
  </text>
  <text x="100" y="340" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#F0C75E" letter-spacing="2">
    Start Thinking.
  </text>
  
  <!-- Accent line -->
  <line x1="100" y1="360" x2="600" y2="360" stroke="#7AB3E0" stroke-width="4"/>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>