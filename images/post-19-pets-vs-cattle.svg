<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Pets vs Cattle visual -->
  <g transform="translate(950, 280)">
    <!-- PET (cute dog on left) -->
    <g transform="translate(-60, 0)">
      <!-- Body -->
      <ellipse cx="0" cy="10" rx="20" ry="30" fill="#F0C75E"/>
      <!-- Head -->
      <circle cx="0" cy="-20" r="18" fill="#F0C75E"/>
      <!-- Ears -->
      <ellipse cx="-10" cy="-35" rx="6" ry="12" fill="#F0C75E"/>
      <ellipse cx="10" cy="-35" rx="6" ry="12" fill="#F0C75E"/>
      <!-- Eyes (cute) -->
      <circle cx="-7" cy="-22" r="4" fill="#2E4057"/>
      <circle cx="7" cy="-22" r="4" fill="#2E4057"/>
      <!-- Pupil shine (cute factor) -->
      <circle cx="-6" cy="-23" r="1.5" fill="#FFFFFF"/>
      <circle cx="8" cy="-23" r="1.5" fill="#FFFFFF"/>
      <!-- Snout -->
      <circle cx="0" cy="-10" r="7" fill="white" opacity="0.7"/>
      <!-- Smile -->
      <path d="M -4,-10 Q 0,-8 4,-10" fill="none" stroke="#2E4057" stroke-width="1.5"/>
      <!-- Tail (happy) -->
      <path d="M 15,0 Q 35,-10 35,-25" fill="none" stroke="#F0C75E" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    <!-- CATTLE (herd on right) -->
    <g transform="translate(60, 0)">
      <!-- Cattle 1 (front) -->
      <ellipse cx="-15" cy="15" rx="18" ry="25" fill="#7AB3E0"/>
      <circle cx="-15" cy="-10" r="15" fill="#7AB3E0"/>
      <!-- Horns -->
      <line x1="-22" y1="-20" x2="-30" y2="-30" stroke="#7AB3E0" stroke-width="2"/>
      <line x1="-8" y1="-20" x2="0" y2="-30" stroke="#7AB3E0" stroke-width="2"/>
      
      <!-- Cattle 2 (back left) -->
      <ellipse cx="0" cy="10" rx="16" ry="22" fill="#7AB3E0" opacity="0.7"/>
      <circle cx="0" cy="-12" r="13" fill="#7AB3E0" opacity="0.7"/>
      
      <!-- Cattle 3 (back right) -->
      <ellipse cx="20" cy="12" rx="14" ry="20" fill="#7AB3E0" opacity="0.6"/>
      <circle cx="20" cy="-10" r="11" fill="#7AB3E0" opacity="0.6"/>
    </g>
    
    <!-- VS symbol -->
    <text x="0" y="15" font-family="Segoe UI" font-size="32" font-weight="bold" fill="#F0C75E" text-anchor="middle">vs</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="240" font-family="Segoe UI, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Pets vs.
  </text>
  <text x="100" y="340" font-family="Segoe UI, sans-serif" font-size="96" font-weight="bold" fill="#F0C75E" letter-spacing="2">
    Cattle
  </text>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>