<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Three connected circles (phases) -->
  <g transform="translate(950, 280)">
    <!-- Circle 1 (Ideate) -->
    <circle cx="-60" cy="0" r="35" fill="none" stroke="#F0C75E" stroke-width="3"/>
    <text x="-60" y="8" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#F0C75E" text-anchor="middle">Ideate</text>
    
    <!-- Circle 2 (Decide) -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#7AB3E0" stroke-width="3"/>
    <text x="0" y="8" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7AB3E0" text-anchor="middle">Decide</text>
    
    <!-- Circle 3 (Execute) -->
    <circle cx="60" cy="0" r="35" fill="none" stroke="#F0C75E" stroke-width="3"/>
    <text x="60" y="8" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#F0C75E" text-anchor="middle">Execute</text>
    
    <!-- Connecting lines -->
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#7AB3E0" stroke-width="2"/>
    <line x1="35" y1="0" x2="25" y2="0" stroke="#F0C75E" stroke-width="2"/>
    
    <!-- Arrows -->
    <polygon points="25,-5 30,0 25,5" fill="#7AB3E0"/>
    <polygon points="85,-5 90,0 85,5" fill="#F0C75E"/>
  </g>
  
  <!-- Main title -->
  <text x="100" y="240" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    The Three-
  </text>
  <text x="100" y="340" font-family="Segoe UI, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Phase AI Team
  </text>
  
  <!-- Accent line -->
  <line x1="100" y1="360" x2="550" y2="360" stroke="#7AB3E0" stroke-width="4"/>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>