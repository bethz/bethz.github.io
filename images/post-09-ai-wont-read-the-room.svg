<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- Background -->
  <rect width="1200" height="628" fill="#2E4057"/>
  
  <!-- Room with people and confused robot -->
  <g transform="translate(920, 280)">
    <!-- Room walls -->
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#7AB3E0" stroke-width="2"/>
    
    <!-- Two people in room (simple silhouettes) -->
    <g transform="translate(-50, -40)">
      <circle cx="0" cy="-15" r="8" fill="#F0C75E" opacity="0.7"/>
      <rect x="-6" y="-5" width="12" height="20" fill="#F0C75E" opacity="0.7"/>
    </g>
    <g transform="translate(50, -40)">
      <circle cx="0" cy="-15" r="8" fill="#F0C75E" opacity="0.7"/>
      <rect x="-6" y="-5" width="12" height="20" fill="#F0C75E" opacity="0.7"/>
    </g>
    
    <!-- Robot head (confused) -->
    <circle cx="0" cy="20" r="25" fill="#7AB3E0"/>
    <!-- Eyes (confused, looking different directions) -->
    <circle cx="-12" cy="12" r="5" fill="#2E4057"/>
    <circle cx="12" cy="18" r="5" fill="#2E4057"/>
    <!-- Question mark above robot -->
    <text x="0" y="-50" font-family="Segoe UI" font-size="40" font-weight="bold" fill="#F0C75E" text-anchor="middle">?</text>
  </g>
  
  <!-- Main title -->
  <text x="100" y="220" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    AI Won't
  </text>
  <text x="100" y="300" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Read the
  </text>
  <text x="100" y="380" font-family="Segoe UI, sans-serif" font-size="72" font-weight="bold" fill="#F0C75E" letter-spacing="2">
    Room
  </text>
  
  <!-- BethZ attribution -->
  <text x="1140" y="610" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#F0C75E" text-anchor="end">BethZ</text>
</svg>