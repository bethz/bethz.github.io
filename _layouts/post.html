---
layout: default
title: Post
---

<article>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %d, %Y" }}</div>
  </div>
  {% if page.image %}
    <img class="post-hero-image" src="{{ page.image }}" alt="{{ page.title }}">
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
</article>
